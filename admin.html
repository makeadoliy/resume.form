<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!--HEAD-START-->
<title>Adoliy Resume Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: inbox-style desk. Request list on the left, full brief on the right; stacks on phones */
:root{
  --bg:#EEF2F0; --paper:#FFFFFF; --ink:#14201B; --muted:#5B6B64; --line:#D3DDD8;
  --band:#14201B; --accent:#0E7A57; --accent-ink:#FFFFFF; --soft:#E1EFE8; --warn:#B4231C;
  --new:#C2410C; --new-bg:#FCEADF; --prog:#1D5FA8; --prog-bg:#E1ECF8; --done:#0E7A57; --done-bg:#E1EFE8;
  --display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1613; --paper:#17211D; --ink:#E6EEEA; --muted:#93A59D; --line:#2A3833;
  --band:#0A110E; --accent:#3DBF8E; --accent-ink:#06130E; --soft:#1C2E27; --warn:#F2786F;
  --new:#FDA772; --new-bg:#3A2418; --prog:#84B6F0; --prog-bg:#1A2A3D; --done:#3DBF8E; --done-bg:#1C2E27; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1613; --paper:#17211D; --ink:#E6EEEA; --muted:#93A59D; --line:#2A3833;
  --band:#0A110E; --accent:#3DBF8E; --accent-ink:#06130E; --soft:#1C2E27; --warn:#F2786F;
  --new:#FDA772; --new-bg:#3A2418; --prog:#84B6F0; --prog-bg:#1A2A3D; --done:#3DBF8E; --done-bg:#1C2E27; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 32px}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:0}

/* Login */
.login{max-width:380px;margin:12vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:14px}
.logo{height:30px;width:auto;display:block}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:28px;line-height:1.1;margin:0}
.err{color:var(--warn);font-size:14px;min-height:1.2em}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-soft{background:var(--soft);color:var(--ink)}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--ink)}

/* Top */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:24px 16px}
.top h1{font-size:26px}
.top .logo{margin-bottom:10px}
.login .logo{margin-bottom:4px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip b{font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{width:220px;max-width:100%}
.banner{background:var(--new-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}

/* Desk */
.desk{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
.item{display:grid;gap:3px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--soft)}
.item-row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-role{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-date{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.New{background:var(--new-bg);color:var(--new)}
.pill.In-progress{background:var(--prog-bg);color:var(--prog)}
.pill.Done{background:var(--done-bg);color:var(--done)}
.empty{padding:40px 20px;color:var(--muted);text-align:center}

.detail{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:22px;min-width:0}
.d-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.d-head h2{font-family:var(--display);font-weight:700;font-size:28px;margin:0;line-height:1.1}
.d-sub{color:var(--muted);font-size:14px;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.back{display:none;background:none;border:0;color:var(--accent);font-weight:600;padding:0;justify-self:start}
.block{display:grid;gap:10px}
.block h3{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;margin:0}
dt{color:var(--muted);font-size:14px}
dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.card{border:1px solid var(--line);border-radius:11px;padding:14px 16px;display:grid;gap:6px}
.card-title{font-weight:600}
.card-meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.jd{background:var(--bg);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;max-height:260px;overflow-y:auto}
.manage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:18px}
.manage textarea{width:100%;min-height:70px;resize:vertical}
.saved{font-size:13px;color:var(--muted)}
.none{color:var(--muted);font-size:14px}

@media (max-width:820px){
  .desk{grid-template-columns:1fr}
  .list{position:static;max-height:none}
  .desk.showing .list{display:none}
  .desk:not(.showing) .detail{display:none}
  .back{display:inline-block}
  dl{grid-template-columns:1fr;gap:2px}
  dd{margin-bottom:8px}
  .manage{grid-template-columns:1fr}
  #q{width:100%}
  .tools{width:100%}
}
.topband{background:var(--band);margin-inline:-16px;padding:14px 16px}.topband-in{max-width:1180px;margin:0 auto;display:flex;align-items:center}.topband img{height:28px;width:auto;display:block}.topband-tag{margin-left:auto;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#FFFFFF;opacity:.75}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div class="topband"><div class="topband-in"><img src="logo-white.png" alt="Adoliy" width="114" height="28"><span class="topband-tag">Admin</span></div></div>
<div class="wrap">

  <div id="deskView" hidden>
    <div class="top">
      <div>
        <h1>Resume Desk</h1>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="Search name, phone, role">
        <button class="btn btn-line" id="refresh" type="button">Refresh</button>
      </div>
    </div>
    <div class="banner" id="demoBanner" hidden>Sample data. Add your Google Script link in config.js to see real submissions.</div>
    <div class="counts" id="counts" style="margin-bottom:14px"></div>
    <div class="desk" id="desk">
      <div class="list" id="list"></div>
      <div class="detail" id="detail"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
  const SCRIPT_URL = (window.ADOLIY_SCRIPT_URL || "").trim();
  const DEMO = !SCRIPT_URL;
  const $ = id => document.getElementById(id);
  const STATUSES = ["New","In progress","Done"];
  let items = [], filter = "All", current = null;

  const SAMPLE = [
    { id:"A1B2C3D4", submitted:new Date(Date.now()-36e5*3).toISOString(), status:"New", fileUrl:"", note:"",
      details:{ name:"Sample: Fathima Rasha K", phone:"+91 90000 00001", email:"rasha.sample@example.com", city:"Edappal", links:"",
        role:"Accounts Executive", where:"Kerala or UAE", jd:"B.Com with 2+ years in Tally Prime and GST returns. Bank reconciliation, vendor payments.",
        exp:[{company:"Malabar Traders, Kuttippuram", role:"Accounts Assistant", from:"June 2022", to:"Present", did:"Sales and purchase bills in Tally, monthly bank reconciliation, GST data for the auditor, petty cash.", numbers:"40+ invoices a day"}],
        edu:[{course:"B.Com Finance", college:"MES College, Ponnani", year:"2022", marks:"74%"}],
        tools:"Tally Prime, MS Excel, GST portal", skills:"Bank reconciliation, vendor follow-up", langs:"Malayalam, English, Hindi",
        certs:"Diploma in Computerised Accounting (2022)", projects:"", awards:"", notes:"" } },
    { id:"E5F6G7H8", submitted:new Date(Date.now()-36e5*28).toISOString(), status:"In progress", fileUrl:"", note:"Draft 1 sent on WhatsApp",
      details:{ name:"Sample: Arjun Menon", phone:"+91 90000 00002", email:"", city:"Thrissur", links:"",
        role:"Sales Executive", where:"Kochi", jd:"",
        exp:[{company:"Sample Motors, Thrissur", role:"Showroom Sales", from:"2023", to:"2025", did:"Walk-in customers, test drives, follow-up calls, loan paperwork.", numbers:"Sold 8 to 10 bikes a month"}],
        edu:[{course:"Plus Two Commerce", college:"GHSS Thrissur", year:"2021", marks:""}],
        tools:"", skills:"Customer handling", langs:"Malayalam, English", certs:"", projects:"", awards:"Top seller, March 2024", notes:"" } },
    { id:"J9K0L1M2", submitted:new Date(Date.now()-36e5*80).toISOString(), status:"Done", fileUrl:"", note:"",
      details:{ name:"Sample: Nihala P", phone:"+91 90000 00003", email:"", city:"Malappuram", links:"",
        role:"Graphic Designer", where:"Remote", jd:"", exp:[], edu:[{course:"BCA", college:"Sample College", year:"Pursuing", marks:""}],
        tools:"Canva, Photoshop", skills:"Social media posts", langs:"Malayalam, English", certs:"", projects:"Logo for a local bakery", awards:"", notes:"Fresher" } }
  ];

  async function api(body){
    const r = await fetch(SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    return r.json();
  }

  // Load
  async function loadItems(){
    $("refresh").textContent = "Loading…";
    try {
      const out = await api({ action:"list" });
      if (out.ok){ items = out.items || []; $("demoBanner").hidden = true; }
      else alertLine("Couldn't load: " + out.error);
    } catch(e){ alertLine("Couldn't reach the Google Sheet. Check the script link in config.js."); }
    $("refresh").textContent = "Refresh";
    if (!current && items.length && window.innerWidth > 820) current = items[0].id;
    render();
  }
  $("refresh").addEventListener("click", () => { if (!DEMO) loadItems(); });

  function openDesk(){
    $("deskView").hidden = false; $("demoBanner").hidden = !DEMO;
    if (!current && items.length && window.innerWidth > 820) current = items[0].id;
    render();
  }

  // Rendering
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const cls = s => s.replace(/\s+/g, "-");
  const fmt = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("en-IN", { day:"numeric", month:"short" }) + ", " + d.toLocaleTimeString("en-IN", { hour:"numeric", minute:"2-digit" }); };

  function visible(){
    const q = $("q").value.trim().toLowerCase();
    return items.filter(it => (filter === "All" || it.status === filter) &&
      (!q || [it.details.name, it.details.phone, it.details.role, it.details.city, it.id].join(" ").toLowerCase().includes(q)));
  }

  function renderCounts(){
    const n = s => s === "All" ? items.length : items.filter(i => i.status === s).length;
    $("counts").innerHTML = ["All", ...STATUSES].map(s => `<button type="button" class="chip" aria-pressed="${filter === s}" data-f="${s}">${s} <b>${n(s)}</b></button>`).join("");
    $("counts").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; render(); }));
  }

  function renderList(){
    const v = visible();
    if (!items.length){ $("list").innerHTML = `<div class="empty">No submissions yet. When a customer submits the form, it shows up here.</div>`; return; }
    if (!v.length){ $("list").innerHTML = `<div class="empty">Nothing matches.</div>`; return; }
    $("list").innerHTML = v.map(it => `
      <button type="button" class="item" data-id="${esc(it.id)}" aria-current="${it.id === current}">
        <div class="item-row"><span class="item-name">${esc(it.details.name || "No name")}</span><span class="pill ${cls(it.status)}">${esc(it.status)}</span></div>
        <div class="item-role">${esc(it.details.role || "")}${it.details.city ? " · " + esc(it.details.city) : ""}</div>
        <div class="item-date">${esc(fmt(it.submitted))}</div>
      </button>`).join("");
    $("list").querySelectorAll(".item").forEach(b => b.addEventListener("click", () => { current = b.dataset.id; $("desk").classList.add("showing"); render(); window.scrollTo(0, 0); }));
  }

  function row(label, val){ return val ? `<dt>${esc(label)}</dt><dd>${esc(val)}</dd>` : ""; }

  function renderDetail(){
    const it = items.find(i => i.id === current);
    if (!it){ $("detail").innerHTML = `<div class="empty">Pick a request on the left to see the full brief.</div>`; return; }
    const d = it.details, phoneDigits = String(d.phone || "").replace(/[^\d]/g, "");
    const exp = (d.exp || []).map(e => `
      <div class="card"><div class="card-title">${esc(e.role || "Role not given")}, ${esc(e.company || "company not given")}</div>
      <div class="card-meta">${esc(e.from || "?")} to ${esc(e.to || "?")}</div>
      ${e.did ? `<p>${esc(e.did)}</p>` : ""}${e.numbers ? `<p><b>Numbers:</b> ${esc(e.numbers)}</p>` : ""}</div>`).join("");
    const edu = (d.edu || []).map(e => `
      <div class="card"><div class="card-title">${esc(e.course || "Course")}</div>
      <div class="card-meta">${esc(e.college || "")}${e.year ? " · " + esc(e.year) : ""}${e.marks ? " · " + esc(e.marks) : ""}</div></div>`).join("");
    const skills = row("Tools", d.tools) + row("Other skills", d.skills) + row("Languages", d.langs);
    const extras = row("Certifications", d.certs) + row("Projects", d.projects) + row("Achievements", d.awards) + row("Notes", d.notes);

    $("detail").innerHTML = `
      <button type="button" class="back" id="back">← All requests</button>
      <div class="d-head">
        <div><h2>${esc(d.name || "No name")}</h2><div class="d-sub">${esc(d.role || "")} · ${esc(fmt(it.submitted))} · Ref ${esc(it.id)}</div></div>
        <div class="actions">
          ${phoneDigits ? `<a class="btn" href="https://wa.me/${phoneDigits.length === 10 ? "91" + phoneDigits : phoneDigits}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
          ${it.fileUrl ? `<a class="btn btn-soft" href="${esc(it.fileUrl)}" target="_blank" rel="noopener">Old resume</a>` : ""}
          <button type="button" class="btn btn-soft" id="copyAll">Copy brief</button>
        </div>
      </div>
      <div class="block"><h3>Contact</h3><dl>${row("Phone", d.phone)}${row("Email", d.email)}${row("City", d.city)}${row("LinkedIn / portfolio", d.links)}</dl></div>
      <div class="block"><h3>Target job</h3><dl>${row("Role", d.role)}${row("Location", d.where)}</dl>${d.jd ? `<div class="jd">${esc(d.jd)}</div>` : ""}</div>
      <div class="block"><h3>Experience</h3>${exp || `<div class="none">Fresher or not filled in.</div>`}</div>
      <div class="block"><h3>Education</h3>${edu || `<div class="none">Not filled in.</div>`}</div>
      ${skills ? `<div class="block"><h3>Skills</h3><dl>${skills}</dl></div>` : ""}
      ${extras ? `<div class="block"><h3>Extras</h3><dl>${extras}</dl></div>` : ""}
      <div class="manage">
        <div class="block"><h3>Status</h3>
          <select id="status">${STATUSES.map(s => `<option ${s === it.status ? "selected" : ""}>${s}</option>`).join("")}</select></div>
        <div class="block"><h3>Your note</h3>
          <textarea id="note" placeholder="e.g. Draft sent, waiting for photo">${esc(it.note || "")}</textarea>
          <div style="display:flex;gap:10px;align-items:center"><button type="button" class="btn btn-soft" id="saveNote">Save note</button><span class="saved" id="saved" aria-live="polite"></span></div></div>
      </div>`;

    $("back").addEventListener("click", () => { $("desk").classList.remove("showing"); current = null; render(); });
    $("status").addEventListener("change", e => update(it, { status: e.target.value }));
    $("saveNote").addEventListener("click", () => update(it, { note: $("note").value }));
    $("copyAll").addEventListener("click", () => {
      const text = briefText(d);
      const done = () => { $("saved").textContent = "Brief copied."; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => { $("saved").textContent = "Copy didn't work in this browser."; });
    });
  }

  function briefText(d){
    const L = (k, v) => v ? k + ": " + v + "\n" : "";
    let t = L("Name", d.name) + L("Phone", d.phone) + L("Email", d.email) + L("City", d.city) + L("Links", d.links) +
      "\nTarget: " + (d.role || "") + (d.where ? " (" + d.where + ")" : "") + "\n" + (d.jd ? "Job post:\n" + d.jd + "\n" : "");
    (d.exp || []).forEach(e => { t += `\nJob: ${e.role} at ${e.company} (${e.from} to ${e.to})\n` + L("Work", e.did) + L("Numbers", e.numbers); });
    (d.edu || []).forEach(e => { t += `\nEducation: ${e.course}, ${e.college}${e.year ? ", " + e.year : ""}${e.marks ? " (" + e.marks + ")" : ""}`; });
    t += "\n\n" + L("Tools", d.tools) + L("Skills", d.skills) + L("Languages", d.langs) + L("Certifications", d.certs) + L("Projects", d.projects) + L("Achievements", d.awards) + L("Notes", d.notes);
    return t.trim();
  }

  async function update(it, patch){
    Object.assign(it, patch);
    renderCounts(); renderList();
    if (DEMO){ $("saved").textContent = "Saved (sample data only)."; return; }
    $("saved").textContent = "Saving…";
    try {
      const out = await api({ action:"update", id: it.id, status: it.status, note: it.note });
      $("saved").textContent = out.ok ? "Saved to your sheet." : "Couldn't save: " + out.error;
    } catch(e){ $("saved").textContent = "Couldn't save. Check your internet."; }
  }

  function alertLine(msg){ $("demoBanner").hidden = false; $("demoBanner").textContent = msg; }

  function render(){ renderCounts(); renderList(); renderDetail(); }
  $("q").addEventListener("input", () => { renderList(); });

  // Start
  if (DEMO){ items = SAMPLE; openDesk(); }
  else { openDesk(); loadItems(); }
})();
</script>
<!--BODY-END-->
</body>
</html>
